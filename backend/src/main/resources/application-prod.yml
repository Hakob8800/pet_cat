spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

file:
  upload-dir: /app/uploads

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain.com}

logging:
  level:
    root: INFO
    com.qrmenu: INFO
    org.springframework.web: INFO
    org.hibernate: WARN

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
