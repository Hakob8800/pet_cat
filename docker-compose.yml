version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qrmenu-db
    environment:
      POSTGRES_DB: qrmenu
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: qrmenu123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
